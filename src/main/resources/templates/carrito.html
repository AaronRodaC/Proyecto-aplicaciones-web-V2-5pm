<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/plantilla :: head}">
    <title>Carrito</title>
</head>

<body>

<header th:replace="~{layout/plantilla :: header}"></header>

<main class="py-5">
<div class="container">

    <h2 class="text-center mb-4">Carrito de compras</h2>

    <div th:if="${session.mensajeCompra != null}"
         class="alert alert-success text-center">
        <span th:text="${session.mensajeCompra}"></span>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="text-center">
        <h5>No hay productos en el carrito</h5>
        <a th:href="@{/index}" class="btn btn-primary mt-3">
            Ir a comprar
        </a>
    </div>

    <div th:if="${!#lists.isEmpty(items)}">

        <div class="table-responsive">
            <table class="table table-bordered text-center align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Imagen</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="item : ${items}">

                        <td>
                            <img th:src="${item.rutaImagen}"
                                 style="width:80px; height:80px; object-fit:cover;">
                        </td>

                        <td th:text="${item.nombre}"></td>

                        <td>
                            ₡<span th:text="${item.precio}"></span>
                        </td>

                        <td th:text="${item.cantidad}"></td>

                        <td>
                            ₡<span th:text="${item.subtotal}"></span>
                        </td>

                        <td>
                            <a th:href="@{/carrito/eliminar/{id}(id=${item.productoId})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Eliminar producto?')">
                                X
                            </a>
                        </td>

                    </tr>

                </tbody>

            </table>
        </div>

        <div class="text-end mt-3">
            <h4>
                Total: ₡<span th:text="${total}"></span>
            </h4>
        </div>

        <div class="d-flex justify-content-between mt-4">

            <a th:href="@{/index}" class="btn btn-primary">
                Seguir comprando
            </a>

            <div>
                <a th:href="@{/carrito/finalizar}"
                   class="btn btn-success"
                   onclick="return confirm('¿Desea finalizar la compra?')">
                    Finalizar compra
                </a>

                <a th:href="@{/carrito/limpiar}"
                   class="btn btn-outline-danger">
                    Vaciar carrito
                </a>
            </div>

        </div>

    </div>

</div>
</main>

<footer th:replace="~{layout/plantilla :: footer}"></footer>

</body>
</html>
