<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{layout/plantilla :: head}">
        <title>Inicio</title>
    </head>

    <body>

        <header th:replace="~{layout/plantilla :: header}"></header>

        <main class="py-5">
            <div class="container">

                <div class="text-center mb-5">
                    <h1 class="fw-bold">Productos destacados</h1>
                    <p>Bienvenido a <strong>Salchi&Friends</strong>, la tienda donde encuentras todo para tus mascotas</p>
                </div>

                <div class="row g-4">

                    <div class="col-md-3" th:each="p : ${productos}">
                        <div class="card tarjeta-producto h-100">

                            <div class="contenedor-imagen">
                                <img th:src="${p.rutaImagen}"
                                     th:alt="${p.nombre}"
                                     class="img-producto">
                            </div>

                            <div class="card-body d-flex flex-column">

                                <h5 class="titulo-producto" th:text="${p.nombre}"></h5>

                                <p class="descripcion-producto" th:text="${p.descripcion}"></p>

                                <p class="precio-producto">
                                    ₡<span th:text="${#numbers.formatDecimal(p.precio,1,'COMMA',0,'POINT')}"></span>
                                </p>

                                <p>
                                    Stock: <span th:text="${p.stock}"></span>
                                </p>

                                <div class="mt-auto">

                                    <a th:href="@{/producto/{id}(id=${p.idProducto})}"
                                       class="btn btn-primary w-100 mb-2">
                                        Ver más
                                    </a>

                                    <form th:action="@{/carrito/agregar}" method="post">
                                        <input type="hidden" name="productoId" th:value="${p.idProducto}">
                                        <input type="hidden" name="cantidad" value="1">
                                        <input type="hidden" name="origen" th:value="${#strings.toLowerCase(tituloCategoria)}">

                                        <button type="submit" class="btn btn-warning w-100">
                                            Agregar al carrito
                                        </button>
                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>

    </body>
</html>
