<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Iniciar Sesión</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"></header>

        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow border-0 rounded-4">
                            <div class="card-body p-5">

                                <div class="text-center mb-4">
                                    <h2 class="fw-bold">Iniciar Sesión</h2>
                                    <p class="text-muted mb-0">Ingrese sus datos para acceder a su cuenta</p>
                                </div>

                                <div th:if="${error}" class="alert alert-danger text-center" role="alert">
                                    <span th:text="${error}"></span>
                                </div>

                                <form th:action="@{/login}" method="post">

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Correo</label>
                                        <input type="email" name="correo" class="form-control rounded-3" placeholder="Ingrese su correo" required>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-semibold">Contraseña</label>
                                        <input type="password" name="password" class="form-control rounded-3" placeholder="Ingrese su contraseña" required>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary rounded-3">Ingresar</button>
                                    </div>
                                </form>

                                <div class="text-center mt-4">
                                    <p class="mb-1">¿No tiene cuenta?</p>
                                    <a th:href="@{/registro}" class="text-decoration-none fw-semibold">Registrarse</a>
                                </div>

                                <div class="text-center mt-2">
                                    <a th:href="@{/index}" class="text-decoration-none text-muted">Volver al inicio</a>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
    </body>
</html>
