<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/plantilla :: head}">
    <title>Búsqueda</title>
</head>

<body>

<header th:replace="~{layout/plantilla :: header}"></header>

<main class="py-5">
    <div class="container">

        <h2 class="text-center mb-2">Resultados de búsqueda</h2>

        <p class="text-center mb-5">
            Buscaste:
            <strong th:text="${textoBuscado}"></strong>
        </p>

        <div th:if="${#lists.isEmpty(productos)}" class="alert alert-warning text-center">
            No se encontraron productos.
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(productos)}">

            <div class="col-md-3" th:each="p : ${productos}">
                <div class="card tarjeta-producto h-100">

                    <div class="contenedor-imagen">
                        <img th:src="${p.rutaImagen}"
                             th:alt="${p.nombre}"
                             class="img-producto">
                    </div>

                    <div class="card-body d-flex flex-column">

                        <h5 th:text="${p.nombre}"></h5>

                        <p th:text="${p.descripcion}"></p>

                        <p class="fw-bold">
                            ₡<span th:text="${p.precio}"></span>
                        </p>

                        <div class="mt-auto">

                            <a th:href="@{/producto/{id}(id=${p.idProducto})}"
                               class="btn btn-primary w-100 mb-2">
                                Ver más
                            </a>

                            <form th:action="@{/carrito/agregar}" method="post">
                                <input type="hidden" name="productoId" th:value="${p.idProducto}">
                                <input type="hidden" name="cantidad" value="1">
                                <input type="hidden" name="origen" value="buscar">

                                <button type="submit" class="btn btn-warning w-100">
                                    Agregar al carrito
                                </button>
                            </form>

                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{layout/plantilla :: footer}"></footer>

</body>
</html>
